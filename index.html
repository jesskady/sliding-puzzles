<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Puzzle</title>
<style>
  :root { --bg:#f4f1ea; --ink:#2b2a28; --tile:#e0a458; --tile-ok:#8fb996; --empty:#d9d3c7; --edge:#2b2a28; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         background:var(--bg); color:var(--ink); font:16px system-ui, sans-serif; padding:24px 16px; box-sizing:border-box; }
  h1 { margin:0 0 12px; font-size:1.6rem; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-bottom:12px; }
  button, select { font:inherit; padding:6px 12px; border:2px solid var(--edge); background:#fff; border-radius:6px; cursor:pointer; }
  button:hover { background:#f0e6d6; }
  .status { min-height:1.5em; margin:8px 0; font-weight:600; }
  /* touch-action:none so sliding a finger on the board moves tiles instead of scrolling/zooming */
  svg { width:min(94vw, 520px); height:auto; max-height:62vh; touch-action:none; user-select:none; -webkit-user-select:none; }
  #peek { touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  @media (hover:none) { .mouse-only { display:none; } }
  @media (max-width:560px) {
    body { padding:12px 10px; }
    h1 { font-size:1.3rem; margin-bottom:8px; }
    .controls { gap:6px; margin-bottom:6px; }
    button, select { padding:8px 10px; font-size:15px; }
  }
  .cell { fill:var(--empty); }
  .tile .shape { fill:var(--tile); stroke:var(--edge); stroke-width:0.03; transition:fill .15s, d .12s ease-out; }
  .tile.home .shape { fill:var(--tile-ok); }
  .tile.movable { cursor:pointer; }
  @media (hover:hover) { .tile.movable:hover .shape { filter:brightness(1.1); } }
  /* Boards with per-tile colors: keep the color, mark "in place" with a white outline */
  .colored .tile .shape { fill:var(--tc); }
  .colored .tile.home .shape { stroke:#fff; stroke-width:0.07; }
  .colored .tile text { fill:#fff; }
  .tile text { font-weight:700; fill:var(--ink); pointer-events:none; dominant-baseline:central; text-anchor:middle; transition:transform .12s ease-out; }
  .tile { transition:transform .12s ease-out; }
</style>
</head>
<body>
<h1>Tile Puzzle</h1>
<div class="controls">
  <label>Board
    <select id="shape">
      <option value="square:3">Square 3×3 (8)</option>
      <option value="square:4" selected>Square 4×4 (15)</option>
      <option value="square:5">Square 5×5 (24)</option>
      <option value="square:6">Square 6×6 (35)</option>
      <option value="pyramid:4">Pyramid 4 rows (15)</option>
      <option value="pyramid:5">Pyramid 5 rows (24)</option>
      <option value="pyramid:6">Pyramid 6 rows (35)</option>
      <option value="stack:4">Triangle stack 4 rows (9)</option>
      <option value="stack:5">Triangle stack 5 rows (14)</option>
      <option value="stack:6">Triangle stack 6 rows (20)</option>
      <option value="hex:3-4-3">Hexagon 3-4-3 (9)</option>
      <option value="hex:3-4-5-4-3">Hexagon 3-4-5-4-3 (18)</option>
      <option value="hex:4-5-6-5-4">Hexagon 4-5-6-5-4 (23)</option>
      <option value="ring:5-1">Ring 5×5, 1×1 hole (23)</option>
      <option value="ring:6-2">Ring 6×6, 2×2 hole (31)</option>
      <option value="ring:7-3">Ring 7×7, 3×3 hole (39)</option>
      <option value="dart:3-6">Dartboard 3 rings × 6 (17)</option>
      <option value="dart:3-8">Dartboard 3 rings × 8 (23)</option>
      <option value="dart:4-8">Dartboard 4 rings × 8 (31)</option>
    </select>
  </label>
  <button id="shuffle">Shuffle</button>
  <button id="reset">Reset</button>
  <button id="solve">Solve</button>
  <button id="peek" title="Hover to see the solved board">Peek</button>
  <label><input type="checkbox" id="hints" checked> Highlight tiles in place</label>
  <label class="mouse-only"><input type="checkbox" id="mousemode"> Mouse-move control</label>
</div>
<div>Moves: <span id="moves">0</span></div>
<div class="status" id="status"></div>
<div id="solveinfo"></div>
<svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
// ---- Board geometry -------------------------------------------------------
// A board is a list of cells, each with a polygon (array of [x,y]), a center,
// and a list of neighbor cell indices. Solved state: tile k sits in cell k-1,
// and the empty space is in the last cell. New shapes (triangle, hex) only need
// a new builder that returns { cells } in this format.

const builders = {
  square(n) {
    const cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const neighbors = [];
      if (r > 0) neighbors.push((r - 1) * n + c);
      if (r < n - 1) neighbors.push((r + 1) * n + c);
      if (c > 0) neighbors.push(r * n + c - 1);
      if (c < n - 1) neighbors.push(r * n + c + 1);
      cells.push({
        poly: [[c, r], [c + 1, r], [c + 1, r + 1], [c, r + 1]],
        center: [c + 0.5, r + 0.5],
        neighbors,
      });
    }
    return { cells, fontScale: 0.4 };
  },

  // Triangle of side n made of unit triangles. Row r has 2r+1 cells,
  // alternating up (even k) and down (odd k). orient marks up=0 / down=1.
  pyramid(n) {
    const h = Math.sqrt(3) / 2, cells = [], rowStart = [];
    for (let r = 0, idx = 0; r < n; idx += 2 * r + 1, r++) rowStart.push(idx);
    for (let r = 0; r < n; r++) {
      const off = (n - 1 - r) / 2, y0 = r * h, y1 = (r + 1) * h;
      for (let k = 0; k <= 2 * r; k++) {
        const j = Math.floor(k / 2), up = k % 2 === 0;
        const poly = up
          ? [[off + j + 0.5, y0], [off + j + 1, y1], [off + j, y1]]
          : [[off + j + 0.5, y0], [off + j + 1.5, y0], [off + j + 1, y1]];
        const neighbors = [];
        if (k > 0) neighbors.push(rowStart[r] + k - 1);
        if (k < 2 * r) neighbors.push(rowStart[r] + k + 1);
        if (up && r < n - 1) neighbors.push(rowStart[r + 1] + k + 1);
        if (!up) neighbors.push(rowStart[r - 1] + k - 1);
        const center = [poly.reduce((s, p) => s + p[0], 0) / 3, poly.reduce((s, p) => s + p[1], 0) / 3];
        cells.push({ poly, center, neighbors, orient: up ? 0 : 1 });
      }
    }
    return { cells, fontScale: 0.24 };
  },

  // Rows of 1..n separate up-pointing triangles on a triangular lattice. Tiles
  // never flip; each cell links to up to 6 lattice neighbors (left/right in its
  // row, and the two nearest triangles in the rows above and below).
  stack(n) {
    const h = Math.sqrt(3) / 2, side = 0.8, th = side * h, cells = [];
    const at = (r, j) => (r >= 0 && r < n && j >= 0 && j <= r ? (r * (r + 1)) / 2 + j : -1);
    for (let r = 0; r < n; r++) for (let j = 0; j <= r; j++) {
      const cx = (n - 1 - r) / 2 + j + 0.5, cy = r * h + h * 2 / 3;
      const poly = [[cx, cy - th * 2 / 3], [cx + side / 2, cy + th / 3], [cx - side / 2, cy + th / 3]];
      const neighbors = [at(r, j - 1), at(r, j + 1), at(r - 1, j - 1), at(r - 1, j), at(r + 1, j), at(r + 1, j + 1)]
        .filter(i => i >= 0);
      cells.push({ poly, center: [cx, cy], neighbors });
    }
    // Hit-test by nearest center: gives each cell a hexagonal zone that fills the gaps.
    return { cells, fontScale: 0.24, hitRadius: 0.7 };
  },

  // Honeycomb of pointy-top hexagons; rows = cells per row (e.g. [3,4,3]).
  // Adjacent rows must differ in length by 1 so they interlock. Neighbors are
  // the cells sharing an edge, i.e. centers exactly 1 apart.
  hex(rows) {
    const R = 1 / Math.sqrt(3), widest = Math.max(...rows), cells = [];
    rows.forEach((k, r) => {
      for (let j = 0; j < k; j++) {
        const cx = (widest - k) / 2 + j + 0.5, cy = r * 1.5 * R + R;
        const poly = [0, 1, 2, 3, 4, 5].map(i => {
          const a = Math.PI / 180 * (60 * i - 90);
          return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
        });
        cells.push({ poly, center: [cx, cy], neighbors: [] });
      }
    });
    cells.forEach((a, i) => cells.forEach((b, j) => {
      if (i !== j && Math.abs(Math.hypot(a.center[0] - b.center[0], a.center[1] - b.center[1]) - 1) < 1e-6) a.neighbors.push(j);
    }));
    return { cells, fontScale: 0.36 };
  },

  // n×n square grid with a centered k×k hole; cells numbered in reading order.
  ring([n, k]) {
    const lo = (n - k) / 2, cells = [], id = {};
    const open = (r, c) => r >= 0 && r < n && c >= 0 && c < n && !(r >= lo && r < lo + k && c >= lo && c < lo + k);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!open(r, c)) continue;
      id[r * n + c] = cells.length;
      cells.push({ poly: [[c, r], [c + 1, r], [c + 1, r + 1], [c, r + 1]], center: [c + 0.5, r + 0.5], rc: [r, c] });
    }
    for (const cell of cells) {
      const [r, c] = cell.rc;
      cell.neighbors = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
        .filter(([a, b]) => open(a, b)).map(([a, b]) => id[a * n + b]);
    }
    return { cells, fontScale: 0.4 };
  },

  // Concentric rings cut into wedges. Cells run inner ring -> outer ring, each
  // ring clockwise from 12 o'clock, so the gap's home is the outer ring's last
  // wedge. Tiles are numbered 1..wedges within each ring and colored by ring;
  // they take the shape of whichever wedge they occupy (morph).
  dart([rings, W]) {
    const seg = 6, cells = [];
    const pt = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];
    const rad = i => (i === 0 ? 0 : i + 0.4); // inner ring a bit wider so its wedges fit numbers
    const colors = rings === 4 ? ['#3f62c4', '#2f9a48', '#d49a1c', '#d23c3c'] : ['#3f62c4', '#2f9a48', '#d23c3c'];
    for (let ring = 0; ring < rings; ring++) for (let w = 0; w < W; w++) {
      const a0 = 2 * Math.PI * w / W, a1 = 2 * Math.PI * (w + 1) / W, outer = [], inner = [];
      for (let s = 0; s <= seg; s++) {
        const a = a0 + (a1 - a0) * s / seg;
        outer.push(pt(rad(ring + 1), a)); inner.push(pt(rad(ring), a));
      }
      const neighbors = [ring * W + (w + 1) % W, ring * W + (w + W - 1) % W];
      if (ring > 0) neighbors.push((ring - 1) * W + w);
      if (ring < rings - 1) neighbors.push((ring + 1) * W + w);
      cells.push({
        poly: outer.concat(inner.reverse()),
        center: pt(ring === 0 ? 0.9 : (rad(ring) + rad(ring + 1)) / 2, (a0 + a1) / 2),
        neighbors, color: colors[ring],
      });
    }
    return {
      cells, fontScale: 0.32, morph: true,
      label: t => ((t - 1) % W) + 1,
      tileColor: t => colors[Math.floor((t - 1) / W)],
    };
  },
};

// ---- State ----------------------------------------------------------------
let board, state, moves, solvedOnce;
// state[cellIndex] = tile number (1..N), or 0 for empty

const svg = document.getElementById('board');
const $moves = document.getElementById('moves');
const $status = document.getElementById('status');
const $hints = document.getElementById('hints');

function newBoard(spec) {
  const [shape, arg] = spec.split(':');
  board = builders[shape](arg.includes('-') ? arg.split('-').map(Number) : Number(arg));
  cancelSolve();
  resetSolved();
  buildSvg();
  shuffle();
}

function solvedState() {
  const n = board.cells.length;
  return board.cells.map((_, i) => (i === n - 1 ? 0 : i + 1));
}

function resetSolved() {
  state = solvedState();
  moves = 0;
}

function emptyCell() { return state.indexOf(0); }

function isSolved() {
  return state.every((t, i) => (i === state.length - 1 ? t === 0 : t === i + 1));
}

// Shuffle by random walk of legal moves from solved -> always solvable on any shape.
function shuffle() {
  cancelSolve();
  resetSolved();
  const steps = board.cells.length * 40;
  let prev = -1;
  for (let i = 0; i < steps; i++) {
    const e = emptyCell();
    const nbrs = board.cells[e].neighbors;
    const opts = nbrs.length > 1 ? nbrs.filter(n => n !== prev) : nbrs; // dead-end corners must backtrack
    const pick = opts[Math.floor(Math.random() * opts.length)];
    state[e] = state[pick]; state[pick] = 0;
    prev = e;
  }
  if (isSolved()) return shuffle();
  moves = 0; solvedOnce = false;
  render();
}

function tryMove(cellIdx, auto = false) {
  if (isSolved()) return; // a solved board is locked until Shuffle
  if (!auto) cancelSolve(); // a manual move takes over from the auto-solver
  const e = emptyCell();
  if (!board.cells[e].neighbors.includes(cellIdx)) return;
  state[e] = state[cellIdx]; state[cellIdx] = 0;
  moves++;
  render();
}

// ---- Rendering ------------------------------------------------------------
let tileEls = {}; // tile number -> <g>

function buildSvg() {
  svg.innerHTML = '';
  tileEls = {};
  const pts = board.cells.flatMap(c => c.poly);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = 0.1;
  const minX = Math.min(...xs) - pad, minY = Math.min(...ys) - pad;
  svg.setAttribute('viewBox', `${minX} ${minY} ${Math.max(...xs) - minX + pad} ${Math.max(...ys) - minY + pad}`);

  const ns = 'http://www.w3.org/2000/svg';
  svg.classList.toggle('colored', !!board.tileColor);
  // Cell backgrounds (tinted with the ring color on boards that have one)
  for (const c of board.cells) {
    const p = document.createElementNS(ns, 'polygon');
    p.setAttribute('points', c.poly.map(q => q.join(',')).join(' '));
    p.setAttribute('class', 'cell');
    if (c.color) { p.style.fill = c.color; p.style.fillOpacity = 0.22; p.style.stroke = '#fff'; p.style.strokeWidth = 0.02; }
    svg.appendChild(p);
  }
  // Tiles: normally each tile's polygon is drawn relative to its home cell's
  // center, then translated to whatever cell it occupies. On morph boards the
  // tile is a path reshaped to the occupied cell in render().
  for (let i = 0; i < board.cells.length - 1; i++) {
    const tile = i + 1, home = board.cells[i];
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'tile');
    if (board.tileColor) g.style.setProperty('--tc', board.tileColor(tile));
    const shrink = 0.94;
    const poly = document.createElementNS(ns, board.morph ? 'path' : 'polygon');
    poly.setAttribute('class', 'shape');
    if (!board.morph) poly.setAttribute('points', home.poly.map(([x, y]) =>
      `${(x - home.center[0]) * shrink},${(y - home.center[1]) * shrink}`).join(' '));
    const t = document.createElementNS(ns, 'text');
    t.textContent = board.label ? board.label(tile) : tile;
    t.setAttribute('font-size', board.fontScale);
    g.append(poly, t);
    svg.appendChild(g);
    tileEls[tile] = g;
  }
}

let peeking = false; // while true, draw the solved board instead of the real one

function render() {
  const view = peeking ? solvedState() : state;
  const movable = new Set(peeking || isSolved() ? [] : board.cells[emptyCell()].neighbors);
  view.forEach((tile, idx) => {
    if (!tile) return;
    const g = tileEls[tile], cell = board.cells[idx], [x, y] = cell.center;
    if (board.morph) {
      // Reshape to the occupied cell (CSS transitions `d`, so it slides and morphs).
      const pts = cell.poly.map(([px, py]) => `${x + (px - x) * 0.94} ${y + (py - y) * 0.94}`);
      g.firstChild.style.d = `path("M ${pts.join(' L ')} Z")`;
      g.lastChild.style.transform = `translate(${x}px, ${y}px)`;
    } else {
      // A triangle entering an opposite-facing cell turns 60° to fit it;
      // the number counter-rotates to stay upright.
      const rot = (cell.orient || 0) !== (board.cells[tile - 1].orient || 0) ? 60 : 0;
      g.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      g.lastChild.style.transform = `rotate(${-rot}deg)`;
    }
    g.classList.toggle('movable', movable.has(idx));
    g.classList.toggle('home', $hints.checked && idx === tile - 1);
  });
  $moves.textContent = moves;
  if (isSolved() && moves > 0) { $status.textContent = `Solved in ${moves} moves!`; solvedOnce = true; }
  else $status.textContent = '';
}

// ---- Mouse-move control ---------------------------------------------------
// When enabled, moving the pointer from the empty cell into a neighboring tile
// slides that tile. Hit-testing uses board geometry (not the animated tile
// elements), so moves register instantly even mid-animation. The pointer path
// is sampled between events so fast swipes don't skip cells.
const $mouse = document.getElementById('mousemode');
let lastCell = null, lastPt = null;

function pointInPoly([x, y], poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function cellAt(pt) {
  if (board.hitRadius) {
    let best = null, bestD = board.hitRadius;
    board.cells.forEach((c, i) => {
      const d = Math.hypot(pt[0] - c.center[0], pt[1] - c.center[1]);
      if (d <= bestD) { best = i; bestD = d; }
    });
    return best;
  }
  const i = board.cells.findIndex(c => pointInPoly(pt, c.poly));
  return i < 0 ? null : i;
}

function enterCell(cell) {
  // Gaps between cells (e.g. the triangle stack) don't break a blank->tile swipe.
  if (cell === null || cell === lastCell) return;
  if (cell !== null && lastCell !== null && lastCell === emptyCell()
      && board.cells[lastCell].neighbors.includes(cell)) tryMove(cell);
  lastCell = cell;
}

function boardPoint(ev) {
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, p.y];
}

// Clicks use the same hit zones as mouse-move control.
svg.addEventListener('click', ev => {
  const cell = cellAt(boardPoint(ev));
  if (cell !== null && state[cell]) tryMove(cell);
});

function trackTo(pt) {
  if (lastPt) {
    const dx = pt[0] - lastPt[0], dy = pt[1] - lastPt[1];
    const steps = Math.ceil(Math.hypot(dx, dy) / 0.1);
    for (let s = 1; s < steps; s++) enterCell(cellAt([lastPt[0] + dx * s / steps, lastPt[1] + dy * s / steps]));
  }
  enterCell(cellAt(pt));
  lastPt = pt;
}

// Swipe tracking: a mouse with "Mouse-move control" on tracks on hover; any
// pointer (finger, pen, or mouse with a button held) tracks while pressed.
const hoverTracking = ev => ev.pointerType === 'mouse' && $mouse.checked;
const resetTrack = () => { lastCell = null; lastPt = null; };
svg.addEventListener('pointerdown', ev => { resetTrack(); trackTo(boardPoint(ev)); });
svg.addEventListener('pointermove', ev => {
  if (ev.buttons || hoverTracking(ev)) trackTo(boardPoint(ev));
  else resetTrack();
});
svg.addEventListener('pointerup', ev => { if (!hoverTracking(ev)) resetTrack(); });
svg.addEventListener('pointercancel', resetTrack);
svg.addEventListener('pointerleave', resetTrack);

// ---- Auto-solve -----------------------------------------------------------
// Search runs in a worker (solver.js) so the page stays responsive; the
// solution is then played back move by move. Any manual action cancels it.
const $solve = document.getElementById('solve');
const $solveinfo = document.getElementById('solveinfo');
let solver = null, playTimer = null;

function cancelSolve() {
  if (solver) { solver.terminate(); solver = null; }
  clearTimeout(playTimer); playTimer = null;
  $solve.textContent = 'Solve';
  $solveinfo.textContent = '';
}

function play(seq, i, delay) {
  if (i === seq.length) { playTimer = null; $solve.textContent = 'Solve'; return; }
  tryMove(state.indexOf(seq[i]), true);
  playTimer = setTimeout(() => play(seq, i + 1, delay), delay);
}

$solve.addEventListener('click', () => {
  if (solver || playTimer) return cancelSolve();
  if (isSolved()) return;
  const t0 = performance.now();
  solver = new Worker('solver.js');
  $solve.textContent = 'Stop';
  $solveinfo.textContent = 'Searching…';
  solver.onmessage = ({ data }) => {
    solver.terminate(); solver = null;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (!data.moves) { $solve.textContent = 'Solve'; $solveinfo.textContent = `No solution found (${secs}s).`; return; }
    $solveinfo.textContent = `Found a ${data.moves.length}-move solution in ${secs}s` +
      (data.optimal ? ' (shortest possible).' : ' (not guaranteed shortest).');
    play(data.moves, 0, Math.max(25, Math.min(250, 15000 / data.moves.length)));
  };
  solver.postMessage({ neighbors: board.cells.map(c => c.neighbors), state });
});

// ---- Wiring ---------------------------------------------------------------
document.getElementById('shape').addEventListener('change', e => newBoard(e.target.value));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.getElementById('reset').addEventListener('click', () => { cancelSolve(); resetSolved(); render(); });
$hints.addEventListener('change', render);
const $peek = document.getElementById('peek');
$peek.addEventListener('pointerenter', () => { peeking = true; render(); });
$peek.addEventListener('pointerleave', () => { peeking = false; render(); });
$peek.addEventListener('contextmenu', ev => ev.preventDefault()); // long-press on touch = peek, not a menu

newBoard(document.getElementById('shape').value);
</script>
</body>
</html>
