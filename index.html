<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Puzzle</title>
<style>
  :root { --bg:#f4f1ea; --ink:#2b2a28; --tile:#e0a458; --tile-ok:#8fb996; --empty:#d9d3c7; --edge:#2b2a28; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         background:var(--bg); color:var(--ink); font:16px system-ui, sans-serif; padding:24px 16px; box-sizing:border-box; }
  h1 { margin:0 0 12px; font-size:1.6rem; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-bottom:12px; }
  button, select { font:inherit; padding:6px 12px; border:2px solid var(--edge); background:#fff; border-radius:6px; cursor:pointer; }
  button:hover { background:#f0e6d6; }
  .status { min-height:1.5em; margin:8px 0; font-weight:600; }
  /* touch-action:none so sliding a finger on the board moves tiles instead of scrolling/zooming */
  svg { width:min(94vw, 520px); height:auto; max-height:62vh; touch-action:none; user-select:none; -webkit-user-select:none; }
  #peek { touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  @media (hover:none) { .mouse-only { display:none; } }
  @media (max-width:560px) {
    body { padding:12px 10px; }
    h1 { font-size:1.3rem; margin-bottom:8px; }
    .controls { gap:6px; margin-bottom:6px; }
    button, select { padding:8px 10px; font-size:15px; }
  }
  .cell { fill:var(--empty); }
  .tile .shape { fill:var(--tile); stroke:var(--edge); stroke-width:0.03; transition:fill .15s, d .12s ease-out; }
  .tile.home .shape { fill:var(--tile-ok); }
  .tile.movable { cursor:pointer; }
  @media (hover:hover) { .tile.movable:hover .shape { filter:brightness(1.1); } }
  /* Boards with per-tile colors: keep the color, mark "in place" with a white outline */
  .colored .tile .shape { fill:var(--tc); }
  .colored .tile.home .shape { stroke:#fff; stroke-width:0.07; }
  .colored .tile text { fill:#fff; }
  .tile text { font-weight:700; fill:var(--ink); pointer-events:none; dominant-baseline:central; text-anchor:middle; transition:transform .12s ease-out; }
  .tile { transition:transform .12s ease-out; }
  #twist { display:block; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:grab; }
  [hidden] { display:none !important; }
  /* Color rings: pale tracks, balls with a thin edge; "in place" gets a white ring */
  .track { fill:none; stroke:#e4ddd0; }
  .rings .tile .shape { stroke:rgba(0,0,0,.35); stroke-width:.012; }
  .rings .tile.home .shape { stroke:#fff; stroke-width:.03; }
  .rings .tile { cursor:grab; }
</style>
</head>
<body>
<h1>Tile Puzzle</h1>
<p style="margin:0 0 12px">More puzzles: <a href="cube/" style="color:inherit">Swipecube</a> (a twisty cube built for phones) · <a href="clock/" style="color:inherit">Clock puzzle</a></p>
<div class="controls">
  <label>Board
    <select id="shape">
      <option value="square:3">Square 3×3 (8)</option>
      <option value="square:4" selected>Square 4×4 (15)</option>
      <option value="square:5">Square 5×5 (24)</option>
      <option value="square:6">Square 6×6 (35)</option>
      <option value="pyramid:4">Pyramid 4 rows (15)</option>
      <option value="pyramid:5">Pyramid 5 rows (24)</option>
      <option value="pyramid:6">Pyramid 6 rows (35)</option>
      <option value="stack:4">Triangle stack 4 rows (9)</option>
      <option value="stack:5">Triangle stack 5 rows (14)</option>
      <option value="stack:6">Triangle stack 6 rows (20)</option>
      <option value="hex:3-4-3">Hexagon 3-4-3 (9)</option>
      <option value="hex:3-4-5-4-3">Hexagon 3-4-5-4-3 (18)</option>
      <option value="hex:4-5-6-5-4">Hexagon 4-5-6-5-4 (23)</option>
      <option value="ring:5-1">Ring 5×5, 1×1 hole (23)</option>
      <option value="ring:6-2">Ring 6×6, 2×2 hole (31)</option>
      <option value="ring:7-3">Ring 7×7, 3×3 hole (39)</option>
      <option value="dart:3-6">Dartboard 3 rings × 6 (17)</option>
      <option value="dart:3-8">Dartboard 3 rings × 8 (23)</option>
      <option value="dart:4-8">Dartboard 4 rings × 8 (31)</option>
      <option value="rings:2">Color rings: 2 overlapping (38 balls)</option>
      <option value="rings:3">Color rings: 3 in a row (68 balls)</option>
      <option value="rings:4">Color rings: 4-leaf clover (98 balls)</option>
      <option value="twist:3">Circle twist: 3 circles (60° turns)</option>
      <option value="twist:4">Circle twist: 4 circles (90° turns)</option>
      <option value="twist:6">Circle twist: 6-circle flower (60° turns)</option>
    </select>
  </label>
  <button id="shuffle">Shuffle</button>
  <button id="reset">Reset</button>
  <button id="solve">Solve</button>
  <button id="peek" title="Hover to see the solved board">Peek</button>
  <label id="hintsLabel"><input type="checkbox" id="hints" checked> Highlight tiles in place</label>
  <label class="mouse-only"><input type="checkbox" id="mousemode"> Mouse-move control</label>
</div>
<div>Moves: <span id="moves">0</span></div>
<div class="status" id="status"></div>
<div id="solveinfo"></div>
<svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
<canvas id="twist" hidden></canvas>

<script>
// ---- Board geometry -------------------------------------------------------
// A board is a list of cells, each with a polygon (array of [x,y]), a center,
// and a list of neighbor cell indices. Solved state: tile k sits in cell k-1,
// and the empty space is in the last cell. New shapes (triangle, hex) only need
// a new builder that returns { cells } in this format.

const builders = {
  square(n) {
    const cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const neighbors = [];
      if (r > 0) neighbors.push((r - 1) * n + c);
      if (r < n - 1) neighbors.push((r + 1) * n + c);
      if (c > 0) neighbors.push(r * n + c - 1);
      if (c < n - 1) neighbors.push(r * n + c + 1);
      cells.push({
        poly: [[c, r], [c + 1, r], [c + 1, r + 1], [c, r + 1]],
        center: [c + 0.5, r + 0.5],
        neighbors,
      });
    }
    return { cells, fontScale: 0.4 };
  },

  // Triangle of side n made of unit triangles. Row r has 2r+1 cells,
  // alternating up (even k) and down (odd k). orient marks up=0 / down=1.
  pyramid(n) {
    const h = Math.sqrt(3) / 2, cells = [], rowStart = [];
    for (let r = 0, idx = 0; r < n; idx += 2 * r + 1, r++) rowStart.push(idx);
    for (let r = 0; r < n; r++) {
      const off = (n - 1 - r) / 2, y0 = r * h, y1 = (r + 1) * h;
      for (let k = 0; k <= 2 * r; k++) {
        const j = Math.floor(k / 2), up = k % 2 === 0;
        const poly = up
          ? [[off + j + 0.5, y0], [off + j + 1, y1], [off + j, y1]]
          : [[off + j + 0.5, y0], [off + j + 1.5, y0], [off + j + 1, y1]];
        const neighbors = [];
        if (k > 0) neighbors.push(rowStart[r] + k - 1);
        if (k < 2 * r) neighbors.push(rowStart[r] + k + 1);
        if (up && r < n - 1) neighbors.push(rowStart[r + 1] + k + 1);
        if (!up) neighbors.push(rowStart[r - 1] + k - 1);
        const center = [poly.reduce((s, p) => s + p[0], 0) / 3, poly.reduce((s, p) => s + p[1], 0) / 3];
        cells.push({ poly, center, neighbors, orient: up ? 0 : 1 });
      }
    }
    return { cells, fontScale: 0.24 };
  },

  // Rows of 1..n separate up-pointing triangles on a triangular lattice. Tiles
  // never flip; each cell links to up to 6 lattice neighbors (left/right in its
  // row, and the two nearest triangles in the rows above and below).
  stack(n) {
    const h = Math.sqrt(3) / 2, side = 0.8, th = side * h, cells = [];
    const at = (r, j) => (r >= 0 && r < n && j >= 0 && j <= r ? (r * (r + 1)) / 2 + j : -1);
    for (let r = 0; r < n; r++) for (let j = 0; j <= r; j++) {
      const cx = (n - 1 - r) / 2 + j + 0.5, cy = r * h + h * 2 / 3;
      const poly = [[cx, cy - th * 2 / 3], [cx + side / 2, cy + th / 3], [cx - side / 2, cy + th / 3]];
      const neighbors = [at(r, j - 1), at(r, j + 1), at(r - 1, j - 1), at(r - 1, j), at(r + 1, j), at(r + 1, j + 1)]
        .filter(i => i >= 0);
      cells.push({ poly, center: [cx, cy], neighbors });
    }
    // Hit-test by nearest center: gives each cell a hexagonal zone that fills the gaps.
    return { cells, fontScale: 0.24, hitRadius: 0.7 };
  },

  // Honeycomb of pointy-top hexagons; rows = cells per row (e.g. [3,4,3]).
  // Adjacent rows must differ in length by 1 so they interlock. Neighbors are
  // the cells sharing an edge, i.e. centers exactly 1 apart.
  hex(rows) {
    const R = 1 / Math.sqrt(3), widest = Math.max(...rows), cells = [];
    rows.forEach((k, r) => {
      for (let j = 0; j < k; j++) {
        const cx = (widest - k) / 2 + j + 0.5, cy = r * 1.5 * R + R;
        const poly = [0, 1, 2, 3, 4, 5].map(i => {
          const a = Math.PI / 180 * (60 * i - 90);
          return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
        });
        cells.push({ poly, center: [cx, cy], neighbors: [] });
      }
    });
    cells.forEach((a, i) => cells.forEach((b, j) => {
      if (i !== j && Math.abs(Math.hypot(a.center[0] - b.center[0], a.center[1] - b.center[1]) - 1) < 1e-6) a.neighbors.push(j);
    }));
    return { cells, fontScale: 0.36 };
  },

  // n×n square grid with a centered k×k hole; cells numbered in reading order.
  ring([n, k]) {
    const lo = (n - k) / 2, cells = [], id = {};
    const open = (r, c) => r >= 0 && r < n && c >= 0 && c < n && !(r >= lo && r < lo + k && c >= lo && c < lo + k);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!open(r, c)) continue;
      id[r * n + c] = cells.length;
      cells.push({ poly: [[c, r], [c + 1, r], [c + 1, r + 1], [c, r + 1]], center: [c + 0.5, r + 0.5], rc: [r, c] });
    }
    for (const cell of cells) {
      const [r, c] = cell.rc;
      cell.neighbors = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
        .filter(([a, b]) => open(a, b)).map(([a, b]) => id[a * n + b]);
    }
    return { cells, fontScale: 0.4 };
  },

  // Concentric rings cut into wedges. Cells run inner ring -> outer ring, each
  // ring clockwise from 12 o'clock, so the gap's home is the outer ring's last
  // wedge. Tiles are numbered 1..wedges within each ring and colored by ring;
  // they take the shape of whichever wedge they occupy (morph).
  dart([rings, W]) {
    const seg = 6, cells = [];
    const pt = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];
    const rad = i => (i === 0 ? 0 : i + 0.4); // inner ring a bit wider so its wedges fit numbers
    const colors = rings === 4 ? ['#3f62c4', '#2f9a48', '#d49a1c', '#d23c3c'] : ['#3f62c4', '#2f9a48', '#d23c3c'];
    for (let ring = 0; ring < rings; ring++) for (let w = 0; w < W; w++) {
      const a0 = 2 * Math.PI * w / W, a1 = 2 * Math.PI * (w + 1) / W, outer = [], inner = [];
      for (let s = 0; s <= seg; s++) {
        const a = a0 + (a1 - a0) * s / seg;
        outer.push(pt(rad(ring + 1), a)); inner.push(pt(rad(ring), a));
      }
      const neighbors = [ring * W + (w + 1) % W, ring * W + (w + W - 1) % W];
      if (ring > 0) neighbors.push((ring - 1) * W + w);
      if (ring < rings - 1) neighbors.push((ring + 1) * W + w);
      cells.push({
        poly: outer.concat(inner.reverse()),
        center: pt(ring === 0 ? 0.9 : (rad(ring) + rad(ring + 1)) / 2, (a0 + a1) / 2),
        neighbors, color: colors[ring],
      });
    }
    return {
      cells, fontScale: 0.32, morph: true,
      label: t => ((t - 1) % W) + 1,
      tileColor: t => colors[Math.floor((t - 1) / W)],
    };
  },

  // Color rings: balls in closed tracks with no gap. Dragging a ring rotates
  // all its balls one step at a time. Balls where tracks meet belong to every
  // track through them: a single crossing ball, or on the clover a whole
  // straight column shared by side-by-side rings. Solved colors follow photos
  // of the physical puzzles. Solved = every position holds its home color.
  rings(kind) {
    const blk = '#2e2e2e', blu = '#2f6fe4', red = '#d23c3c', yel = '#e6b81c', D = Math.PI / 180;
    const circle = (cx, cy, n, startDeg) => Array.from({ length: n }, (_, k) => {
      const t = (startDeg + k * 360 / n) * D;
      return [cx + Math.cos(t), cy + Math.sin(t)];
    });
    const angle = ([x, y], [cx, cy]) => Math.atan2(y - cy, x - cx) / D; // -180..180, clockwise on screen
    let def;
    if (kind === 2) {
      // Two rings of 20 crossing at 90°, 4 balls between the crossings.
      // Left: blue over its upper-left arc, red below and on its inner arc.
      // Right: yellow over its lower-right arc, black on top and its inner arc.
      // Top crossing black, bottom crossing red (10/10/9/9).
      const c = [[-Math.SQRT1_2, 0], [Math.SQRT1_2, 0]];
      def = { centers: c, ballR: 0.13, tracks: [circle(...c[0], 20, 45), circle(...c[1], 20, 135)],
        color(p, on) {
          if (on.length > 1) return p[1] < 0 ? blk : red;
          if (on[0] === 0) { const a = angle(p, c[0]); return a <= -60 || a >= 150 ? blu : red; }
          const a = angle(p, c[1]);
          return a > -30 && a < 120 ? yel : blk;
        } };
    } else if (kind === 3) {
      // A chain of three rings of 24. Outer rings: red (left) and yellow
      // (right), with their inner arcs matching the middle ring's half they
      // sit in. Middle ring: black on its left and top, blue on its right and
      // bottom. Left crossings black, right crossings blue (17 of each color).
      const c = [[-Math.SQRT2, 0], [0, 0], [Math.SQRT2, 0]];
      def = { centers: c, ballR: 0.11, tracks: c.map(([x, y]) => circle(x, y, 24, 0)),
        color(p, on) {
          if (on.length > 1) return p[0] < 0 ? blk : blu;
          const a = angle(p, c[on[0]]);
          if (on[0] === 0) return Math.abs(a) < 45 ? blk : red;
          if (on[0] === 2) return Math.abs(a) > 135 ? blu : yel;
          return a > -45 && a <= 120 ? blu : blk;
        } };
    } else {
      // Clover of four 28-ball tracks: black, blue / red, yellow. Each track is
      // a circle with its inner side flattened into a straight column of 5
      // balls shared with its side neighbor; tracks above and below cross at
      // two balls. Top column: 3 black over 2 blue. Bottom column: 2 red over
      // 3 yellow. Left crossings red, right crossings blue.
      const R = 14 / Math.PI, alpha = Math.PI / 7, step = Math.PI / 14;
      const a = R * Math.cos(alpha), s = R * Math.sin(alpha), b = R * Math.sin(2 * Math.PI / 7);
      const tl = [];
      for (let i = 0; i <= 4; i++) tl.push([0, -b - s + i * s / 2]); // shared column, top to bottom
      for (let j = 1; j <= 23; j++) { const t = alpha + j * step; tl.push([-a + R * Math.cos(t), -b + R * Math.sin(t)]); }
      // mirroring flips direction, so reverse to keep every track clockwise
      const mirror = (pts, fx, fy) => { const m = pts.map(([x, y]) => [x * fx + 0, y * fy + 0]); return fx * fy < 0 ? m.reverse() : m; };
      const own = [blk, blu, red, yel];
      def = { centers: [[-a, -b], [a, -b], [-a, b], [a, b]], ballR: 0.4,
        tracks: [tl, mirror(tl, -1, 1), mirror(tl, 1, -1), mirror(tl, -1, -1)], // TL TR BL BR
        color([x, y], on) {
          if (on.length === 1) return own[on[0]];
          if (Math.abs(x) < 1e-6) {
            const i = Math.round((Math.abs(y) - (b - s)) / (s / 2)); // 0 = end nearest the middle
            return y < 0 ? (i <= 1 ? blu : blk) : (i <= 1 ? red : yel);
          }
          return x < 0 ? red : blu;
        } };
    }
    const ballR = def.ballR, cells = [];
    const find = (x, y) => cells.findIndex(c => Math.hypot(c.center[0] - x, c.center[1] - y) < 1e-6);
    const rings = def.tracks.map((pts, ri) => ({
      center: def.centers[ri],
      cells: pts.map(([x, y]) => { // in clockwise order on screen
        let i = find(x, y);
        if (i < 0) {
          i = cells.length;
          const poly = [0, 1, 2, 3, 4, 5, 6, 7].map(j => [x + ballR * 1.25 * Math.cos(j * Math.PI / 4), y + ballR * 1.25 * Math.sin(j * Math.PI / 4)]);
          cells.push({ center: [x, y], poly, neighbors: [] });
        }
        return i;
      }),
    }));
    cells.forEach((c, i) => { c.color = def.color(c.center, rings.flatMap((r, ri) => r.cells.includes(i) ? [ri] : [])); });
    return { cells, rings, ballR, fontScale: 0, label: () => '', tileColor: t => cells[t - 1].color };
  },

  // Circle twist: overlapping disks that each rotate in fixed steps, carrying
  // everything inside them (including parts of the disks they overlap). The
  // surface is a fine lattice of points that a step maps exactly onto itself:
  // a triangular lattice for 60° steps, a square one for 90°. Every disk is
  // centered on a lattice point, so turns are exact permutations and the
  // puzzle never drifts, however long you play. Solved colors follow photos of
  // the physical puzzles: each region is colored by which disks cover it.
  twist(kind) {
    const S3 = Math.sqrt(3) / 2, tri = kind !== 4;
    let centers, r, palette, colorOf;
    if (kind === 3) {
      // Red on top, blue left, green right; overlaps mix like colored light.
      const D = 96; r = D / 1.4;
      centers = [[D, -D], [0, 0], [D, 0]]; // red, blue, green
      palette = ['#f2412f', '#2f45d8', '#5fe07d', '#ff8088', '#ffd23a', '#43b5f2', '#f7dce8'];
      colorOf = m => ({ '0': 0, '1': 1, '2': 2, '01': 3, '02': 4, '12': 5 })[m.join('')] ?? 6;
    } else if (kind === 4) {
      // 2×2: red, peach / violet, sky blue; pairwise overlaps get their own
      // colors (red+peach orange, red+violet magenta, peach+blue teal,
      // violet+blue navy) and the middle, where three or four meet, is pale lavender.
      const D = 110; r = D / 1.15;
      centers = [[0, 0], [D, 0], [0, D], [D, D]]; // TL TR BL BR
      palette = ['#e23b3b', '#f3b46c', '#6a3fd0', '#3fa3f0', '#f57c1f', '#d9409e', '#3fcfa2', '#2c33b8', '#ece2f6'];
      colorOf = m => m.length === 1 ? m[0] : (({ '01': 4, '02': 5, '13': 6, '23': 7 })[m.join('')] ?? 8);
    } else {
      // Six disks around a center, each passing through it. Where a disk is
      // alone it shows its color; everywhere two or more overlap is white.
      const R = 72; r = R;
      centers = [[R, 0], [0, R], [-R, R], [-R, 0], [0, -R], [R, -R]]; // yellow, green, blue, purple, red, orange
      palette = ['#f6cc2e', '#1fa37a', '#2f6fe4', '#7a3fc4', '#e2343a', '#f26a2e', '#f4f1f8'];
      colorOf = m => m.length === 1 ? m[0] : 6;
    }
    const r4 = 4 * r * r + 1e-6;
    const inDisk = (i, j, [ci, cj]) => {
      const di = i - ci, dj = j - cj;
      return (tri ? (2 * di + dj) ** 2 + 3 * dj * dj : 4 * (di * di + dj * dj)) <= r4;
    };
    const key = (i, j) => (i + 4096) * 8192 + (j + 4096);
    const pts = [], colors = [], masks = [], index = new Map();
    const ci = centers.map(c => c[0]), cj = centers.map(c => c[1]), span = Math.ceil(2 * r) + 2;
    for (let j = Math.min(...cj) - span; j <= Math.max(...cj) + span; j++)
      for (let i = Math.min(...ci) - 2 * span; i <= Math.max(...ci) + 2 * span; i++) {
        const m = centers.flatMap((c, k) => inDisk(i, j, c) ? [k] : []);
        if (!m.length) continue;
        index.set(key(i, j), pts.length);
        pts.push([i, j]); colors.push(colorOf(m)); masks.push(m.reduce((s, k) => s | (1 << k), 0));
      }
    // one clockwise step for each disk, as [from, to] index pairs
    const perms = centers.map(c => {
      const pairs = [];
      pts.forEach(([i, j], p) => {
        if (!inDisk(i, j, c)) return;
        const di = i - c[0], dj = j - c[1];
        const [ri, rj] = tri ? [-dj, di + dj] : [-dj, di];
        pairs.push(p, index.get(key(c[0] + ri, c[1] + rj)));
      });
      return Int32Array.from(pairs);
    });
    // Pieces: points that always move together. Start from "which disks cover
    // this point" and keep splitting groups until every turn maps whole groups
    // onto whole groups. What's left are the physical pieces, whose borders
    // are the grooves drawn on the puzzle.
    const N = pts.length, fwd = [], back = [];
    perms.forEach(perm => {
      const f = new Int32Array(N).fill(-1), b = new Int32Array(N).fill(-1);
      for (let q = 0; q < perm.length; q += 2) { f[perm[q]] = perm[q + 1]; b[perm[q + 1]] = perm[q]; }
      fwd.push(f); back.push(b);
    });
    let label = Int32Array.from(masks), count = new Set(masks).size;
    for (let it = 0; it < 500; it++) {
      const ids = new Map(), next = new Int32Array(N);
      for (let p = 0; p < N; p++) {
        let sig = label[p] + ':';
        for (let d = 0; d < fwd.length; d++) sig += fwd[d][p] < 0 ? '-,' : label[fwd[d][p]] + '.' + label[back[d][p]] + ',';
        let id = ids.get(sig);
        if (id === undefined) { id = ids.size; ids.set(sig, id); }
        next[p] = id;
      }
      label = next;
      if (ids.size === count) break;
      count = ids.size;
    }
    const pieceColor = new Uint8Array(count), size = new Int32Array(count);
    label.forEach((id, p) => { pieceColor[id] = colors[p]; size[id]++; });
    // Points lying exactly on a circle's edge (like the 6-circle flower's
    // center) come out as specks; they're part of a groove, not real pieces.
    const tiny = size.map(s => (s < N / count / 50 ? 1 : 0));
    // lattice neighbors (right, and the one or two below) for drawing grooves
    const nbr = pts.map(([i, j]) => (tri ? [[i + 1, j], [i, j + 1], [i - 1, j + 1]] : [[i + 1, j], [i, j + 1]])
      .map(([a, b]) => index.get(key(a, b)) ?? -1));
    // Offscreen image: one pixel per point on the square lattice; on the
    // triangular lattice each point is two half-width pixels so rows can
    // offset by half a point.
    const px = tri ? pts.map(([i, j]) => 2 * i + j) : pts.map(([i]) => i), py = pts.map(([, j]) => j);
    const minX = Math.min(...px), minY = Math.min(...py);
    const img = {
      w: Math.max(...px) - minX + (tri ? 2 : 1), h: Math.max(...py) - minY + 1,
      x0: tri ? minX / 2 - 0.5 : minX - 0.5, y0: tri ? minY * S3 - S3 / 2 : minY - 0.5,
      pw: tri ? 0.5 : 1, ph: tri ? S3 : 1,
    };
    const pix = Int32Array.from(pts.map((_, p) => (py[p] - minY) * img.w + (px[p] - minX)));
    const hex = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
    return {
      cells: [],
      twist: {
        tri, r, step: tri ? 60 : 90, perms, pix, img, pts,
        centers: centers.map(([i, j]) => (tri ? [i + j / 2, j * S3] : [i, j])),
        palette: palette.map(hex), solved: label, solvedColor: Uint8Array.from(colors), pieceColor,
        pieces: count, tiny, nbr: Int32Array.from(nbr.flat()), nbrN: tri ? 3 : 2,
      },
    };
  },
};

// ---- State ----------------------------------------------------------------
let board, state, moves, solvedOnce;
// state[cellIndex] = tile number (1..N), or 0 for empty

const svg = document.getElementById('board');
const $moves = document.getElementById('moves');
const $status = document.getElementById('status');
const $hints = document.getElementById('hints');

function newBoard(spec) {
  const [shape, arg] = spec.split(':');
  board = builders[shape](arg.includes('-') ? arg.split('-').map(Number) : Number(arg));
  cancelSolve();
  $solve.hidden = !!(board.rings || board.twist); // the auto-solver only knows gap puzzles
  svg.toggleAttribute('hidden', !!board.twist); twCanvas.hidden = !board.twist; // (SVG elements have no .hidden property)
  document.getElementById('hintsLabel').hidden = !!board.twist;
  resetSolved();
  if (board.twist) setupTwist(); else buildSvg();
  shuffle();
}

function solvedState() {
  const n = board.cells.length;
  if (board.twist) return board.twist.solved.slice();
  if (board.rings) return board.cells.map((_, i) => i + 1); // no gap
  return board.cells.map((_, i) => (i === n - 1 ? 0 : i + 1));
}

function resetSolved() {
  state = solvedState();
  moves = 0;
}

function emptyCell() { return state.indexOf(0); }

// Ring boards: a ball is "home" when its color matches the position's color.
const atHome = (tile, idx) => board.rings
  ? board.cells[tile - 1].color === board.cells[idx].color
  : idx === tile - 1;

function isSolved() {
  if (board.twist) {
    const T = board.twist;
    return state.every((id, i) => T.tiny[id] || T.tiny[T.solved[i]] || T.pieceColor[id] === T.solvedColor[i]);
  }
  if (board.rings) return state.every((t, i) => atHome(t, i));
  return state.every((t, i) => (i === state.length - 1 ? t === 0 : t === i + 1));
}

// Shuffle by random walk of legal moves from solved -> always solvable on any shape.
function shuffle() {
  cancelSolve();
  resetSolved();
  if (board.twist) {
    const T = board.twist, n = 360 / T.step;
    for (let i = 0; i < 30; i++) turnDisk(Math.floor(Math.random() * T.centers.length), 1 + Math.floor(Math.random() * (n - 1)));
    if (isSolved()) return shuffle();
    moves = 0; solvedOnce = false;
    render();
    return;
  }
  if (board.rings) {
    // random ring turns; a few hundred is plenty to mix every color
    for (let i = 0; i < board.cells.length * 8; i++)
      spinRing(Math.floor(Math.random() * board.rings.length), Math.random() < 0.5 ? 1 : -1);
    if (isSolved()) return shuffle();
    moves = 0; solvedOnce = false;
    render();
    return;
  }
  const steps = board.cells.length * 40;
  let prev = -1;
  for (let i = 0; i < steps; i++) {
    const e = emptyCell();
    const nbrs = board.cells[e].neighbors;
    const opts = nbrs.length > 1 ? nbrs.filter(n => n !== prev) : nbrs; // dead-end corners must backtrack
    const pick = opts[Math.floor(Math.random() * opts.length)];
    state[e] = state[pick]; state[pick] = 0;
    prev = e;
  }
  if (isSolved()) return shuffle();
  moves = 0; solvedOnce = false;
  render();
}

function tryMove(cellIdx, auto = false) {
  if (isSolved()) return; // a solved board is locked until Shuffle
  if (!auto) cancelSolve(); // a manual move takes over from the auto-solver
  const e = emptyCell();
  if (!board.cells[e].neighbors.includes(cellIdx)) return;
  state[e] = state[cellIdx]; state[cellIdx] = 0;
  moves++;
  render();
}

// Rotate ring ri one ball clockwise (dir 1) or counterclockwise (dir -1).
function spinRing(ri, dir) {
  const r = board.rings[ri].cells, n = r.length, old = r.map(i => state[i]);
  r.forEach((cell, j) => { state[cell] = old[(j - dir + n) % n]; });
}

// ---- Rendering ------------------------------------------------------------
let tileEls = {}; // tile number -> <g>

function buildSvg() {
  svg.innerHTML = '';
  tileEls = {};
  const pts = board.cells.flatMap(c => c.poly);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = 0.1;
  const minX = Math.min(...xs) - pad, minY = Math.min(...ys) - pad;
  svg.setAttribute('viewBox', `${minX} ${minY} ${Math.max(...xs) - minX + pad} ${Math.max(...ys) - minY + pad}`);

  const ns = 'http://www.w3.org/2000/svg';
  svg.classList.toggle('colored', !!board.tileColor);
  svg.classList.toggle('rings', !!board.rings);
  if (board.rings) { buildRingsSvg(ns); return; }
  // Cell backgrounds (tinted with the ring color on boards that have one)
  for (const c of board.cells) {
    const p = document.createElementNS(ns, 'polygon');
    p.setAttribute('points', c.poly.map(q => q.join(',')).join(' '));
    p.setAttribute('class', 'cell');
    if (c.color) { p.style.fill = c.color; p.style.fillOpacity = 0.22; p.style.stroke = '#fff'; p.style.strokeWidth = 0.02; }
    svg.appendChild(p);
  }
  // Tiles: normally each tile's polygon is drawn relative to its home cell's
  // center, then translated to whatever cell it occupies. On morph boards the
  // tile is a path reshaped to the occupied cell in render().
  for (let i = 0; i < board.cells.length - 1; i++) {
    const tile = i + 1, home = board.cells[i];
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'tile');
    if (board.tileColor) g.style.setProperty('--tc', board.tileColor(tile));
    const shrink = 0.94;
    const poly = document.createElementNS(ns, board.morph ? 'path' : 'polygon');
    poly.setAttribute('class', 'shape');
    if (!board.morph) poly.setAttribute('points', home.poly.map(([x, y]) =>
      `${(x - home.center[0]) * shrink},${(y - home.center[1]) * shrink}`).join(' '));
    const t = document.createElementNS(ns, 'text');
    t.textContent = board.label ? board.label(tile) : tile;
    t.setAttribute('font-size', board.fontScale);
    g.append(poly, t);
    svg.appendChild(g);
    tileEls[tile] = g;
  }
}

// Ring boards: a light track for each ring, then one ball per position.
function buildRingsSvg(ns) {
  const m = board.ballR * 2.2;
  const xs = board.cells.map(c => c.center[0]), ys = board.cells.map(c => c.center[1]);
  const minX = Math.min(...xs) - m, minY = Math.min(...ys) - m;
  svg.setAttribute('viewBox', `${minX} ${minY} ${Math.max(...xs) + m - minX} ${Math.max(...ys) + m - minY}`);
  for (const r of board.rings) {
    const c = document.createElementNS(ns, 'polygon');
    c.setAttribute('points', r.cells.map(i => board.cells[i].center.join(',')).join(' '));
    c.setAttribute('class', 'track'); c.setAttribute('stroke-width', board.ballR * 2.6);
    c.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(c);
  }
  for (let i = 0; i < board.cells.length; i++) {
    const tile = i + 1, g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'tile');
    g.style.setProperty('--tc', board.tileColor(tile));
    const ball = document.createElementNS(ns, 'circle');
    ball.setAttribute('class', 'shape'); ball.setAttribute('r', board.ballR);
    g.appendChild(ball);
    svg.appendChild(g);
    tileEls[tile] = g;
  }
}

let peeking = false; // while true, draw the solved board instead of the real one

// ---- Circle twist ---------------------------------------------------------
// Turn disk d by k clockwise steps (negative = counterclockwise).
function turnDisk(d, k) {
  const T = board.twist, n = 360 / T.step, perm = T.perms[d];
  k = ((k % n) + n) % n;
  for (let s = 0; s < k; s++) {
    const old = state.slice();
    for (let q = 0; q < perm.length; q += 2) state[perm[q + 1]] = old[perm[q]];
  }
}

const twCanvas = document.getElementById('twist');
const twOff = document.createElement('canvas');
let twImg = null, twView = null, twDrag = null;

function setupTwist() {
  const T = board.twist;
  twOff.width = T.img.w; twOff.height = T.img.h;
  twImg = twOff.getContext('2d').createImageData(T.img.w, T.img.h);
  sizeTwist();
}

// Fit the puzzle to the canvas (sharp on high-density screens).
function sizeTwist() {
  const T = board.twist, pad = T.r * 0.12;
  const xs = T.centers.map(c => c[0]), ys = T.centers.map(c => c[1]);
  const minX = Math.min(...xs) - T.r - pad, maxX = Math.max(...xs) + T.r + pad;
  const minY = Math.min(...ys) - T.r - pad, maxY = Math.max(...ys) + T.r + pad;
  const aspect = (maxY - minY) / (maxX - minX);
  const cssW = Math.min(window.innerWidth * 0.94, 520, window.innerHeight * 0.62 / aspect);
  const dpr = window.devicePixelRatio || 1;
  twCanvas.style.width = cssW + 'px'; twCanvas.style.height = cssW * aspect + 'px';
  twCanvas.width = Math.round(cssW * dpr); twCanvas.height = Math.round(cssW * aspect * dpr);
  const K = twCanvas.width / (maxX - minX);
  twView = { K, tx: -minX * K, ty: -minY * K, dpr };
}

function renderTwist() {
  const T = board.twist, ids = peeking ? T.solved : state, data = twImg.data, nn = T.nbrN;
  for (let p = 0; p < ids.length; p++) {
    let [r, g, b] = T.palette[T.pieceColor[ids[p]]];
    // a groove wherever this point and a neighbor belong to different pieces
    for (let k = 0; k < nn; k++) {
      const q = T.nbr[p * nn + k];
      if (T.tiny[ids[p]] || (q >= 0 && ids[q] !== ids[p] && !T.tiny[ids[q]])) { r = r * 0.45 + 18; g = g * 0.45 + 18; b = b * 0.45 + 24; break; }
    }
    for (let k = 0, o = T.pix[p] * 4; k < (T.tri ? 2 : 1); k++, o += 4) { data[o] = r; data[o + 1] = g; data[o + 2] = b; data[o + 3] = 255; }
  }
  twOff.getContext('2d').putImageData(twImg, 0, 0);
  const ctx = twCanvas.getContext('2d'), { K, tx, ty } = twView;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, twCanvas.width, twCanvas.height);
  ctx.setTransform(K, 0, 0, K, tx, ty);
  const circle = c => { ctx.moveTo(c[0] + T.r, c[1]); ctx.arc(c[0], c[1], T.r, 0, 2 * Math.PI); };
  const drawImg = () => { ctx.imageSmoothingEnabled = true; ctx.drawImage(twOff, T.img.x0, T.img.y0, T.img.w * T.img.pw, T.img.h * T.img.ph); };
  // dark frame around the outline, like the puzzle's base
  ctx.beginPath(); T.centers.forEach(circle);
  ctx.lineWidth = T.r * 0.12; ctx.strokeStyle = '#2b2a33'; ctx.stroke();
  ctx.save(); ctx.beginPath(); T.centers.forEach(circle); ctx.clip();
  drawImg();
  if (twDrag && twDrag.angle) { // the disk being turned, at its in-between angle
    const c = T.centers[twDrag.disk];
    ctx.save(); ctx.beginPath(); circle(c); ctx.clip();
    ctx.translate(c[0], c[1]); ctx.rotate(twDrag.angle); ctx.translate(-c[0], -c[1]);
    drawImg(); ctx.restore();
  }
  ctx.restore();
  // faint outline of each turning disk
  ctx.lineWidth = T.r * 0.012; ctx.strokeStyle = 'rgba(0,0,0,.28)';
  T.centers.forEach(c => { ctx.beginPath(); circle(c); ctx.stroke(); });
  if (twDrag) {
    ctx.lineWidth = T.r * 0.03; ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); circle(T.centers[twDrag.disk]); ctx.stroke();
  }
  $moves.textContent = moves;
  if (isSolved() && moves > 0) { $status.textContent = `Solved in ${moves} moves!`; solvedOnce = true; }
  else $status.textContent = '';
}

// Drag a disk around its center: it follows your finger, then snaps to the
// nearest step when you let go. Where disks overlap, the touch picks the disk
// whose center is closest.
function twPoint(ev) {
  const rect = twCanvas.getBoundingClientRect(), { K, tx, ty, dpr } = twView;
  return [((ev.clientX - rect.left) * dpr - tx) / K, ((ev.clientY - rect.top) * dpr - ty) / K];
}
twCanvas.addEventListener('pointerdown', ev => {
  if (!board.twist || twDrag) return;
  const T = board.twist, p = twPoint(ev);
  let best = -1, bestD = Infinity;
  T.centers.forEach((c, i) => { const d = Math.hypot(p[0] - c[0], p[1] - c[1]); if (d <= T.r && d < bestD) { best = i; bestD = d; } });
  if (best < 0) return;
  ev.preventDefault();
  try { twCanvas.setPointerCapture(ev.pointerId); } catch (e) {}
  const c = T.centers[best];
  twDrag = { id: ev.pointerId, disk: best, angle: 0, last: Math.atan2(p[1] - c[1], p[0] - c[0]) };
  render();
});
twCanvas.addEventListener('pointermove', ev => {
  if (!twDrag || ev.pointerId !== twDrag.id || twDrag.snapping) return;
  const c = board.twist.centers[twDrag.disk], p = twPoint(ev);
  if (Math.hypot(p[0] - c[0], p[1] - c[1]) < board.twist.r * 0.08) return; // too near the center to read
  const a = Math.atan2(p[1] - c[1], p[0] - c[0]);
  let d = a - twDrag.last;
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  twDrag.last = a; twDrag.angle += d;
  render();
});
function twRelease(ev) {
  if (!twDrag || ev.pointerId !== twDrag.id || twDrag.snapping) return;
  const step = board.twist.step * Math.PI / 180, k = Math.round(twDrag.angle / step);
  const from = twDrag.angle, to = k * step, t0 = performance.now(), dur = 110;
  twDrag.snapping = true;
  const frame = now => {
    const t = Math.min(1, (now - t0) / dur), e = 1 - (1 - t) ** 3;
    twDrag.angle = from + (to - from) * e;
    if (t < 1) { render(); requestAnimationFrame(frame); return; }
    if (k) { turnDisk(twDrag.disk, k); moves += Math.abs(k); }
    twDrag = null; render();
  };
  requestAnimationFrame(frame);
}
twCanvas.addEventListener('pointerup', twRelease);
twCanvas.addEventListener('pointercancel', twRelease);
twCanvas.addEventListener('contextmenu', ev => ev.preventDefault());
window.addEventListener('resize', () => { if (board.twist) { sizeTwist(); render(); } });

function render() {
  if (board.twist) return renderTwist();
  const view = peeking ? solvedState() : state;
  const movable = new Set(peeking || isSolved() || board.rings ? [] : board.cells[emptyCell()].neighbors);
  view.forEach((tile, idx) => {
    if (!tile) return;
    const g = tileEls[tile], cell = board.cells[idx], [x, y] = cell.center;
    if (board.morph) {
      // Reshape to the occupied cell (CSS transitions `d`, so it slides and morphs).
      const pts = cell.poly.map(([px, py]) => `${x + (px - x) * 0.94} ${y + (py - y) * 0.94}`);
      g.firstChild.style.d = `path("M ${pts.join(' L ')} Z")`;
      g.lastChild.style.transform = `translate(${x}px, ${y}px)`;
    } else {
      // A triangle entering an opposite-facing cell turns 60° to fit it;
      // the number counter-rotates to stay upright.
      const rot = (cell.orient || 0) !== (board.cells[tile - 1].orient || 0) ? 60 : 0;
      g.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      g.lastChild.style.transform = `rotate(${-rot}deg)`;
    }
    g.classList.toggle('movable', movable.has(idx));
    g.classList.toggle('home', $hints.checked && atHome(tile, idx));
  });
  $moves.textContent = moves;
  if (isSolved() && moves > 0) { $status.textContent = `Solved in ${moves} moves!`; solvedOnce = true; }
  else $status.textContent = '';
}

// ---- Mouse-move control ---------------------------------------------------
// When enabled, moving the pointer from the empty cell into a neighboring tile
// slides that tile. Hit-testing uses board geometry (not the animated tile
// elements), so moves register instantly even mid-animation. The pointer path
// is sampled between events so fast swipes don't skip cells.
const $mouse = document.getElementById('mousemode');
let lastCell = null, lastPt = null;

function pointInPoly([x, y], poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function cellAt(pt) {
  if (board.hitRadius) {
    let best = null, bestD = board.hitRadius;
    board.cells.forEach((c, i) => {
      const d = Math.hypot(pt[0] - c.center[0], pt[1] - c.center[1]);
      if (d <= bestD) { best = i; bestD = d; }
    });
    return best;
  }
  const i = board.cells.findIndex(c => pointInPoly(pt, c.poly));
  return i < 0 ? null : i;
}

function enterCell(cell) {
  // Gaps between cells (e.g. the triangle stack) don't break a blank->tile swipe.
  if (cell === null || cell === lastCell) return;
  if (cell !== null && lastCell !== null && lastCell === emptyCell()
      && board.cells[lastCell].neighbors.includes(cell)) tryMove(cell);
  lastCell = cell;
}

function boardPoint(ev) {
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, p.y];
}

// Clicks use the same hit zones as mouse-move control.
svg.addEventListener('click', ev => {
  if (board.rings) return;
  const cell = cellAt(boardPoint(ev));
  if (cell !== null && state[cell]) tryMove(cell);
});

function trackTo(pt) {
  if (board.rings) return; // ring boards use ring dragging below
  if (lastPt) {
    const dx = pt[0] - lastPt[0], dy = pt[1] - lastPt[1];
    const steps = Math.ceil(Math.hypot(dx, dy) / 0.1);
    for (let s = 1; s < steps; s++) enterCell(cellAt([lastPt[0] + dx * s / steps, lastPt[1] + dy * s / steps]));
  }
  enterCell(cellAt(pt));
  lastPt = pt;
}

// Swipe tracking: a mouse with "Mouse-move control" on tracks on hover; any
// pointer (finger, pen, or mouse with a button held) tracks while pressed.
const hoverTracking = ev => ev.pointerType === 'mouse' && $mouse.checked;
const resetTrack = () => { lastCell = null; lastPt = null; };
svg.addEventListener('pointerdown', ev => { resetTrack(); trackTo(boardPoint(ev)); });
svg.addEventListener('pointermove', ev => {
  if (ev.buttons || hoverTracking(ev)) trackTo(boardPoint(ev));
  else resetTrack();
});
svg.addEventListener('pointerup', ev => { if (!hoverTracking(ev)) resetTrack(); });
svg.addEventListener('pointercancel', resetTrack);
svg.addEventListener('pointerleave', resetTrack);

// ---- Ring dragging --------------------------------------------------------
// Grab any ball and drag along its track: the ring turns one ball-step for each
// step of angle your finger travels around the ring's center, so the ball
// stays under your finger. A ball where two tracks cross picks the ring whose
// direction best matches your first movement.
let rdrag = null;
svg.addEventListener('pointerdown', ev => {
  if (!board.rings) return;
  const pt = boardPoint(ev);
  let best = -1, bestD = board.ballR * 1.8;
  board.cells.forEach((c, i) => {
    const d = Math.hypot(pt[0] - c.center[0], pt[1] - c.center[1]);
    if (d < bestD) { best = i; bestD = d; }
  });
  if (best < 0) return;
  ev.preventDefault();
  try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
  rdrag = { id: ev.pointerId, cell: best, start: pt, ring: null, a: 0, acc: 0 };
});
svg.addEventListener('pointermove', ev => {
  if (!rdrag || ev.pointerId !== rdrag.id) return;
  const pt = boardPoint(ev);
  if (rdrag.ring === null) {
    const dx = pt[0] - rdrag.start[0], dy = pt[1] - rdrag.start[1];
    if (Math.hypot(dx, dy) < board.ballR * 0.6) return;
    const c = board.cells[rdrag.cell].center;
    let bestS = -1;
    board.rings.forEach((r, i) => {
      if (!r.cells.includes(rdrag.cell)) return;
      const tx = -(c[1] - r.center[1]), ty = c[0] - r.center[0]; // tangent of ring i at this ball
      const s = Math.abs(dx * tx + dy * ty) / Math.hypot(tx, ty) / Math.hypot(dx, dy);
      // On a shared column both rings run the same way; the touch's side picks the ring.
      const near = -Math.hypot(rdrag.start[0] - r.center[0], rdrag.start[1] - r.center[1]) * 1e-3;
      if (s + near > bestS) { bestS = s + near; rdrag.ring = i; }
    });
    const [cx, cy] = board.rings[rdrag.ring].center;
    rdrag.a = Math.atan2(rdrag.start[1] - cy, rdrag.start[0] - cx);
  }
  const ring = board.rings[rdrag.ring], [cx, cy] = ring.center;
  const a = Math.atan2(pt[1] - cy, pt[0] - cx);
  let d = a - rdrag.a;
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  rdrag.a = a; rdrag.acc += d;
  const step = 2 * Math.PI / ring.cells.length;
  let turned = false;
  while (Math.abs(rdrag.acc) >= step) {
    const s = Math.sign(rdrag.acc);
    rdrag.acc -= s * step;
    spinRing(rdrag.ring, s); moves++; turned = true;
  }
  if (turned) render();
});
const endRingDrag = ev => { if (rdrag && ev.pointerId === rdrag.id) rdrag = null; };
svg.addEventListener('pointerup', endRingDrag);
svg.addEventListener('pointercancel', endRingDrag);

// ---- Auto-solve -----------------------------------------------------------
// Search runs in a worker (solver.js) so the page stays responsive; the
// solution is then played back move by move. Any manual action cancels it.
const $solve = document.getElementById('solve');
const $solveinfo = document.getElementById('solveinfo');
let solver = null, playTimer = null;

function cancelSolve() {
  if (solver) { solver.terminate(); solver = null; }
  clearTimeout(playTimer); playTimer = null;
  $solve.textContent = 'Solve';
  $solveinfo.textContent = '';
}

function play(seq, i, delay) {
  if (i === seq.length) { playTimer = null; $solve.textContent = 'Solve'; return; }
  tryMove(state.indexOf(seq[i]), true);
  playTimer = setTimeout(() => play(seq, i + 1, delay), delay);
}

$solve.addEventListener('click', () => {
  if (solver || playTimer) return cancelSolve();
  if (isSolved()) return;
  const t0 = performance.now();
  solver = new Worker('solver.js');
  $solve.textContent = 'Stop';
  $solveinfo.textContent = 'Searching…';
  solver.onmessage = ({ data }) => {
    solver.terminate(); solver = null;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (!data.moves) { $solve.textContent = 'Solve'; $solveinfo.textContent = `No solution found (${secs}s).`; return; }
    $solveinfo.textContent = `Found a ${data.moves.length}-move solution in ${secs}s` +
      (data.optimal ? ' (shortest possible).' : ' (not guaranteed shortest).');
    play(data.moves, 0, Math.max(25, Math.min(250, 15000 / data.moves.length)));
  };
  solver.postMessage({ neighbors: board.cells.map(c => c.neighbors), state });
});

// ---- Wiring ---------------------------------------------------------------
document.getElementById('shape').addEventListener('change', e => newBoard(e.target.value));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.getElementById('reset').addEventListener('click', () => { cancelSolve(); resetSolved(); render(); });
$hints.addEventListener('change', render);
const $peek = document.getElementById('peek');
$peek.addEventListener('pointerenter', () => { peeking = true; render(); });
$peek.addEventListener('pointerleave', () => { peeking = false; render(); });
$peek.addEventListener('contextmenu', ev => ev.preventDefault()); // long-press on touch = peek, not a menu

newBoard(document.getElementById('shape').value);
</script>
</body>
